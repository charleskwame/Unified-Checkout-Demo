<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unified Checkout Demo</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #f5f5f5;
        margin: 0;
        padding: 20px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
      }

      #unified-checkout-container {
        width: 100%;
        max-width: 400px;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 20px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      #unified-checkout-container p {
        margin: 8px 0;
        color: #333;
      }

      #unified-checkout-container p:first-child {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 16px;
      }

      #proceedToPayment {
        width: 100%;
        padding: 12px;
        margin-top: 16px;
        background-color: #007bff;
        color: #fff;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
      }

      #proceedToPayment:hover {
        background-color: #0056b3;
      }

      /*#buttonPaymentListContainer,
      #embeddedPaymentContainer {
        width: 100%;
        max-width: 400px;
        margin-top: 16px;
      }*/

      #priceDiv{
      display: flex;
      justify-content: space-between;
      align-items: center;
      }

      #priceDiv > p{
      width: fit-content;
      }

      #itemName{
      font-size: large;
      font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div id="unified-checkout-container">
      <p>Order Summary</p>
      <p id="itemName">1x BMX Racing Bike</p>
      <div id="priceDiv">
        <p>Ghc</p>
        <p>300.00</p>
      </div>
      <button id="proceedToPayment">Proceed to Payment</button>
    </div>

    <!-- Container for payment option buttons (Google Pay, Apple Pay, Card, etc.) -->
    <!--<div id="buttonPaymentListContainer"></div>-->

    <!-- Container for embedded payment forms -->
    <div id="embeddedPaymentContainer"></div>
  </body>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
  <script src="./index.js" type="module"></script>
</html>
